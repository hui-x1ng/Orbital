<!DOCTYPE html>
<html>

    <div id="achievements-list">

        <div class="achievements-grid" id="achievementsGrid">
        </div>

        <div id="achievementModal" class="modal hidden">
            <div class="modal-content">
                <span id="closeModalBtn" class="close-btn">&times;</span>
                <div id="modalAchievementIcon" class="modal-achievement-icon"></div>
                <h2 id="modalAchievementName" class="modal-achievement-name"></h2>
                <p id="modalAchievementDetails" class="modal-achievement-details"></p>
                <div id="modalAchievementDateTime" class="modal-achievement-datetime"></div>
            </div>
        </div>
        <button id="refreshPetsBtn">Refresh</button>
    </div>
</html>
