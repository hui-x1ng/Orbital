<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>tamaCodechi - Login (Debug)</title>
        <link rel="stylesheet" href="../style.css">
        <style>
            .login-container {
                max-width: 400px;
                margin: 0 auto;
            }
            
            .debug-info {
                position: fixed;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 10px;
                border-radius: 5px;
                font-size: 12px;
                z-index: 9999;
                max-width: 300px;
            }
            
            .form-tabs {
                display: flex;
                margin-bottom: 20px;
                border-radius: 10px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.1);
            }
            
            .tab-button {
                flex: 1;
                padding: 15px;
                background: transparent;
                border: none;
                color: rgba(255, 255, 255, 0.7);
                cursor: pointer;
                transition: all 0.3s ease;
                font-size: 16px;
            }
            
            .tab-button.active {
                background: rgba(255, 255, 255, 0.2);
                color: white;
            }
            
            .tab-button:hover {
                background: rgba(255, 255, 255, 0.15);
                color: white;
            }
            
            .form-container {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: white;
                font-weight: 500;
            }
            
            .form-group input {
                width: 100%;
                padding: 12px 15px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.1);
                color: white;
                font-size: 16px;
                box-sizing: border-box;
                transition: all 0.3s ease;
            }
            
            .form-group input:focus {
                outline: none;
                border-color: #00bcd4;
                box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.3);
                background: rgba(255, 255, 255, 0.15);
            }
            
            .form-group input::placeholder {
                color: rgba(255, 255, 255, 0.5);
            }
            
            .error-message {
                background: rgba(244, 67, 54, 0.2);
                color: #ff6b6b;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                border: 1px solid rgba(244, 67, 54, 0.3);
                font-size: 14px;
            }
            
            .success-message {
                background: rgba(76, 175, 80, 0.2);
                color: #6bcf7f;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                border: 1px solid rgba(76, 175, 80, 0.3);
                font-size: 14px;
            }
            
            .submit-button {
                width: 100%;
                padding: 15px;
                background: linear-gradient(45deg, #00bcd4, #4fc3f7);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
            }
            
            .submit-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 188, 212, 0.4);
            }
            
            .submit-button:disabled {
                background: rgba(255, 255, 255, 0.3);
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }
            
            .hidden {
                display: none;
            }
            
            .form-footer {
                text-align: center;
                margin-top: 20px;
                color: rgba(255, 255, 255, 0.7);
                font-size: 14px;
            }

            .test-button {
                background: #ff6b6b;
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                margin: 5px;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <div class="debug-info" id="debugInfo">
            <div>Page Status: <span id="pageStatus">Loading...</span></div>
            <div>electronAPI: <span id="electronStatus">Checking...</span></div>
            <div>Event Binding: <span id="eventStatus">Not Bound</span></div>
            <div>Error Info: <span id="errorInfo">None</span></div>
            <button class="test-button" onclick="testBasicFunction()">Test Basic Function</button>
            <button class="test-button" onclick="testElectronAPI()">Test ElectronAPI</button>
        </div>

        <div class="centered-container">
            <div class="login-container">
                <div class="form-container">
                    <h2 style="text-align: center; margin-bottom: 30px; color: white;">
                        Welcome to tamaCodechi (Debug)
                    </h2>
                    
                    <div class="form-tabs">
                        <button class="tab-button active" id="loginTab">Login</button>
                        <button class="tab-button" id="registerTab">Register</button>
                    </div>
                    
                    <div id="errorMessage" class="error-message hidden"></div>
                    <div id="successMessage" class="success-message hidden"></div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginUsername">Username</label>
                            <input type="text" id="loginUsername" placeholder="Enter your username" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                        
                        <button type="submit" class="submit-button" id="loginBtn">
                            Login
                        </button>
                    </form>
                    
                    <form id="registerForm" class="hidden">
                        <div class="form-group">
                            <label for="registerUsername">Username</label>
                            <input type="text" id="registerUsername" placeholder="Enter username (at least 3 characters)" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <input type="password" id="registerPassword" placeholder="Enter password (at least 6 characters)" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                        
                        <button type="submit" class="submit-button" id="registerBtn">
                            Register
                        </button>
                    </form>
                    
                    <div class="form-footer">
                        <p>Create your virtual pet and start an amazing journey!</p>
                    </div>
                </div>
            </div>
        </div>
        
        <script>
            function updateDebugInfo(field, value) {
                const element = document.getElementById(field);
                if (element) {
                    element.textContent = value;
                    console.log(`[DEBUG] ${field}: ${value}`);
                }
            }
            
            function testBasicFunction() {
                updateDebugInfo('errorInfo', 'Testing basic functionality...');
                try {
                    alert('Basic JavaScript functionality is working!');
                    updateDebugInfo('errorInfo', 'Basic functionality OK');
                } catch (error) {
                    updateDebugInfo('errorInfo', 'Basic functionality error: ' + error.message);
                }
            }
            
            function testElectronAPI() {
                updateDebugInfo('errorInfo', 'Testing ElectronAPI...');
                if (window.electronAPI) {
                    if (window.electronAPI.test) {
                        try {
                            const result = window.electronAPI.test();
                            alert('ElectronAPI test successful: ' + result);
                            updateDebugInfo('errorInfo', 'ElectronAPI OK');
                        } catch (error) {
                            updateDebugInfo('errorInfo', 'ElectronAPI call error: ' + error.message);
                        }
                    } else {
                        updateDebugInfo('errorInfo', 'ElectronAPI missing test method');
                    }
                } else {
                    updateDebugInfo('errorInfo', 'ElectronAPI unavailable');
                }
            }
            
            document.addEventListener('DOMContentLoaded', function() {
                updateDebugInfo('pageStatus', 'DOM loaded');
                
                try {
                    if (window.electronAPI) {
                        updateDebugInfo('electronStatus', '✅ Available (' + Object.keys(window.electronAPI).length + ' methods)');
                    } else {
                        updateDebugInfo('electronStatus', '❌ Unavailable');
                        updateDebugInfo('errorInfo', 'electronAPI not found - this is a major issue');
                    }
                    
                    const loginTab = document.getElementById('loginTab');
                    const registerTab = document.getElementById('registerTab');
                    
                    if (loginTab && registerTab) {
                        loginTab.addEventListener('click', function() {
                            console.log('[DEBUG] Login tab clicked');
                            switchTab('login');
                        });
                        
                        registerTab.addEventListener('click', function() {
                            console.log('[DEBUG] Register tab clicked');
                            switchTab('register');
                        });
                        
                        updateDebugInfo('eventStatus', 'Tab events bound');
                    } else {
                        updateDebugInfo('errorInfo', 'Tab elements not found');
                    }
                    
                    const loginForm = document.getElementById('loginForm');
                    const registerForm = document.getElementById('registerForm');
                    
                    if (loginForm) {
                        loginForm.addEventListener('submit', function(e) {
                            e.preventDefault();
                            console.log('[DEBUG] Login form submitted');
                            handleLogin();
                        });
                    }
                    
                    if (registerForm) {
                        registerForm.addEventListener('submit', function(e) {
                            e.preventDefault();
                            console.log('[DEBUG] Register form submitted');
                            handleRegister();
                        });
                    }
                    
                    updateDebugInfo('eventStatus', '✅ All events bound');
                    updateDebugInfo('pageStatus', '✅ Initialization complete');
                    
                } catch (error) {
                    updateDebugInfo('errorInfo', 'Initialization error: ' + error.message);
                    console.error('[DEBUG] Initialization error:', error);
                }
            });
            
            function switchTab(tab) {
                console.log('[DEBUG] Switching to tab:', tab);
                
                const loginTab = document.getElementById('loginTab');
                const registerTab = document.getElementById('registerTab');
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');
                
                if (tab === 'login') {
                    loginTab.classList.add('active');
                    registerTab.classList.remove('active');
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                } else {
                    registerTab.classList.add('active');
                    loginTab.classList.remove('active');
                    registerForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                }
                hideMessages();
            }
            
            function showError(message) {
                const errorMessage = document.getElementById('errorMessage');
                const successMessage = document.getElementById('successMessage');
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
                updateDebugInfo('errorInfo', message);
            }
            
            function showSuccess(message) {
                const successMessage = document.getElementById('successMessage');
                const errorMessage = document.getElementById('errorMessage');
                successMessage.textContent = message;
                successMessage.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                updateDebugInfo('errorInfo', 'Success: ' + message);
            }
            
            function hideMessages() {
                document.getElementById('errorMessage').classList.add('hidden');
                document.getElementById('successMessage').classList.add('hidden');
            }
            
            function handleLogin() {
                console.log('[DEBUG] Handling login');
                
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                const loginBtn = document.getElementById('loginBtn');
                
                if (!username || !password) {
                    showError('Please fill in all login fields');
                    return;
                }
                
                console.log('[DEBUG] Login info:', { username, passwordLength: password.length });
                
                if (!window.electronAPI) {
                    showError('ElectronAPI unavailable, cannot login');
                    return;
                }
                
                if (!window.electronAPI.getUserByUsername) {
                    showError('Missing getUserByUsername method');
                    return;
                }
                
                try {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Logging in...';
                    hideMessages();
                    
                    window.electronAPI.getUserByUsername(username).then(user => {
                        console.log('[DEBUG] User query result:', user);
                        
                        if (!user) {
                            throw new Error('User does not exist');
                        }
                        
                        showSuccess('Login successful! Redirecting...');
                        
                        localStorage.setItem('user', JSON.stringify({ username }));
                        
                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 1500);
                        
                    }).catch(error => {
                        console.error('[DEBUG] Login error:', error);
                        showError(error.message || 'Login failed, please try again');
                    }).finally(() => {
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    });
                    
                } catch (error) {
                    console.error('[DEBUG] Login processing error:', error);
                    showError('Login processing error: ' + error.message);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            }
            
            function handleRegister() {
                console.log('[DEBUG] Handling registration');
                
                const username = document.getElementById('registerUsername').value.trim();
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const registerBtn = document.getElementById('registerBtn');
                
                if (!username || !password || !confirmPassword) {
                    showError('Please fill in all registration fields');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError('Passwords do not match');
                    return;
                }
                
                if (username.length < 3) {
                    showError('Username must be at least 3 characters');
                    return;
                }
                
                if (password.length < 6) {
                    showError('Password must be at least 6 characters');
                    return;
                }
                
                console.log('[DEBUG] Registration info:', { username, passwordLength: password.length });
                
                if (!window.electronAPI) {
                    showError('ElectronAPI unavailable, cannot register');
                    return;
                }
                
                try {
                    registerBtn.disabled = true;
                    registerBtn.textContent = 'Registering...';
                    hideMessages();
                    
                    function simpleHash(password) {
                        let hash = 0;
                        const salt = 'tamacodchi_salt_2024';
                        const combined = password + salt;
                        
                        for (let i = 0; i < combined.length; i++) {
                            const char = combined.charCodeAt(i);
                            hash = ((hash << 5) - hash) + char;
                            hash = hash & hash;
                        }
                        
                        return Math.abs(hash).toString(16);
                    }
                    
                    const hashedPassword = simpleHash(password);
                    console.log('[DEBUG] Password hashed');
                    
                    window.electronAPI.checkUserExists(username).then(exists => {
                        if (exists) {
                            throw new Error('Username already exists');
                        }
                        
                        return window.electronAPI.registerUser({ 
                            username, 
                            pw: hashedPassword 
                        });
                        
                    }).then(result => {
                        console.log('[DEBUG] Registration result:', result);
                        
                        showSuccess('Registration successful! Redirecting...');
                        
                        localStorage.setItem('user', JSON.stringify({ username }));
                        
                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 1500);
                        
                    }).catch(error => {
                        console.error('[DEBUG] Registration error:', error);
                        showError(error.message || 'Registration failed, please try again');
                    }).finally(() => {
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Register';
                    });
                    
                } catch (error) {
                    console.error('[DEBUG] Registration processing error:', error);
                    showError('Registration processing error: ' + error.message);
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Register';
                }
            }
            
            window.addEventListener('error', function(e) {
                updateDebugInfo('errorInfo', 'Page error: ' + e.error.message);
                console.error('[DEBUG] Page error:', e.error);
            });
            
            window.addEventListener('unhandledrejection', function(e) {
                updateDebugInfo('errorInfo', 'Promise error: ' + e.reason);
                console.error('[DEBUG] Promise error:', e.reason);
            });
        </script>
    </body>
</html>
