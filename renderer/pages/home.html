<!DOCTYPE html>

<div id="mainContainer" class="card">
    <h1>Hello <span id="userDisplay"></span></h1>
    <button id="generatePetBtn">generate your pet</button>
    <div id="petNameContainer" class="hidden">
        <input id="petNameInput" placeholder="Enter pet name" />
        <button id="confirmPetNameBtn">OK</button>
        <button id="cancelPetNameBtn">Cancel</button>
    </div>
    <button id="callPetBtn">call out your pet!</button>
    <div id="errorMessage" style="color: red; font-size: 14px; margin: 10px 0; display: none;"></div>
    <div id="petDisplay" class="hidden">
        <h3 id="pet-name">Your Pet</h3>
        <p id="pet-hp">HP: </p>
        <p id="pet-intimacy">Intimacy: </p>
        <p>Try touching your pet</p>
        <button id="feed-btn">Feed</button>
        <button id="killPetBtn">kill it</button>
    </div>
</div>
