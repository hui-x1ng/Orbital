<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>tamaCodechi</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="loginContainer" class="card">
            <h2>Welcome to tamaCodechi</h2>
            <input type="text" id="username" placeholder="enter anything" />
            <input type="password" id="password" placeholder="password is petlover" />
            <button id="loginBtn">Login</button>
        </div>

        <div id="mainContainer" class="card hidden">
            <h1>Hello <span id="userDisplay"></span></h1>
            <button id="generatePetBtn">generate your pet</button>
            <button id="killPetBtn">kill it</button>

            <div id="petDisplay" class="hidden">
                <h3 id="pet-name">Your Pet</h3>
                <p id="pet-hp">HP: </p>
                <p id="pet-hunger">Hunger: </p>
                <button id="feed-btn">Feed</button>
            </div>
        </div>

        <script src="renderer.js"></script>
    </body>
</html>
